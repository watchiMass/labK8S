<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4697"/>
      <stop offset="100%" stop-color="#123173"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.65" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#2a5bb8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#123173" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Manchot « Linux Foundation Education » stylisé, d'après le desktop d'examen. -->
  <g transform="translate(1210 300) scale(1.15)">
    <!-- pieds -->
    <ellipse cx="55" cy="305" rx="38" ry="16" fill="#f5a623"/>
    <ellipse cx="145" cy="305" rx="38" ry="16" fill="#f5a623"/>

    <!-- corps -->
    <ellipse cx="100" cy="210" rx="96" ry="120" fill="#111111"/>
    <!-- ventre -->
    <ellipse cx="100" cy="225" rx="62" ry="95" fill="#ffffff"/>

    <!-- tête -->
    <circle cx="100" cy="92" r="70" fill="#111111"/>
    <!-- joues -->
    <ellipse cx="72" cy="96" rx="29" ry="33" fill="#ffffff"/>
    <ellipse cx="128" cy="96" rx="29" ry="33" fill="#ffffff"/>
    <!-- yeux -->
    <circle cx="78" cy="91" r="7" fill="#111111"/>
    <circle cx="122" cy="91" r="7" fill="#111111"/>
    <circle cx="80" cy="88" r="2.5" fill="#ffffff"/>
    <circle cx="124" cy="88" r="2.5" fill="#ffffff"/>
    <!-- bec -->
    <path d="M100 112 L74 132 L126 132 Z" fill="#f5a623"/>
    <path d="M100 112 L100 140" stroke="#d98c12" stroke-width="2"/>

    <!-- chapeau de diplômé -->
    <path d="M20 46 L100 8 L180 46 L100 84 Z" fill="#111111"/>
    <path d="M55 68 L55 96 Q100 116 145 96 L145 68" fill="#111111"/>
    <path d="M100 46 L100 78" stroke="#111111" stroke-width="4"/>
    <circle cx="100" cy="80" r="6" fill="#f5a623"/>
    <path d="M180 46 L196 116" stroke="#f5a623" stroke-width="3"/>
    <circle cx="196" cy="120" r="6" fill="#f5a623"/>

    <!-- texte -->
    <text x="100" y="390" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
          font-size="42" font-weight="bold" fill="#ffffff">LINUX</text>
    <text x="100" y="432" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
          font-size="31" fill="#ffffff">Foundation</text>
    <text x="100" y="470" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
          font-size="31" fill="#ffffff">Education</text>
  </g>
</svg>
